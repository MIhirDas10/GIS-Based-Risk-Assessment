name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pinned deliberately: an unpinned ruff silently gains new default rules
      # on release and turns a green build red without any code change.
      - name: Install ruff
        run: pip install ruff==0.16.9

      # Rule selection and per-file exemptions live in pyproject.toml.
      - name: Lint
        run: ruff check src/ dashboard/ tests/ scripts/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Integration tests (database, Redis, MLflow, API) are excluded here:
      # they need the Docker stack and a populated database. Run them locally
      # with: pytest tests/ -v
      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m "not integration"
